name: Bug Report
description: Report a bug
title: "bug: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: input
    attributes:
      label: Browser Version
      placeholder: Chrome 127.0.6533.89
    validations:
      required: true
  - type: input
    attributes:
      label: Extension Version
      placeholder: 0.1.0
    validations:
      required: true
